<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yursic Studio</title>
<meta name="description" content="Yursic Studio: a multitrack music studio in your browser. Record, arrange loops, add effects and plugins, export WAV.">
<meta name="theme-color" content="#14141A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C5CFF'/%3E%3Cpath d='M14 40v-8M22 46V18M30 38V26M38 50V14M46 42V22' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#7C5CFF; --accent2:#00D4AA; --rec:#FF3B5C; --bg:#14141A; --surface:#1E1E26; --surface2:#272731;
  --line:#33333F; --dim:#9A9AAE; --text:#EDEDF5; --row:96px; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:#30303c}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
button.primary:hover{background:#9278FF}
button.danger{color:#ff8fa3}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--surface2)}
button.on{background:var(--accent);border-color:var(--accent)}
input[type=text],input[type=number],input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
input[type=range]{accent-color:var(--accent);cursor:pointer}
:focus{outline:none}
:focus-visible,body.gamepad :focus{outline:3px solid var(--accent2)!important;outline-offset:2px}
.dim{color:var(--dim)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.hidden{display:none!important}

/* shell */
#app{display:grid;grid-template-rows:52px 1fr;height:100%}
#nav{display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
#nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:18px}
#nav .logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:13px}
#nav button.tab{background:transparent;border:none;padding:8px 14px;color:var(--dim);border-radius:8px}
#nav button.tab.active{color:var(--text);background:var(--surface2)}
#main{overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow:auto;padding:28px 40px}
.page h1{margin:0 0 4px;font-size:26px}
.page h2{font-size:17px;margin:28px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
button.card:hover{background:var(--surface2)}
.card .title{font-weight:600;font-size:16px}
.card .bar{height:4px;border-radius:2px;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.item .name{font-weight:600}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--dim);margin-top:12px}
.drop.over{border-color:var(--accent);color:var(--text)}
.meterbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meterbar>div{height:100%;background:var(--accent2)}
.empty{padding:30px;text-align:center;color:var(--dim)}

/* studio */
#studio{position:absolute;inset:0;display:grid;grid-template-rows:60px 1fr auto}
#transport{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
#transport .big{width:42px;height:42px;padding:0;border-radius:50%;font-size:16px;display:grid;place-items:center;flex:none}
#transport .rec{color:var(--rec)}
#transport .rec.on{background:var(--rec);border-color:var(--rec);color:#fff}
#clock{font:600 18px/1 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:170px;text-align:center;flex:none}
#clock small{display:block;font-size:11px;color:var(--dim);margin-top:3px}
#transport input[type=number]{width:70px}
.sep{width:1px;height:30px;background:var(--line);flex:none;margin:0 4px}
#projname{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
#tl{display:grid;grid-template-columns:230px 1fr;min-height:0}
#heads{position:relative;overflow:hidden;background:var(--surface);border-right:1px solid var(--line)}
#headsInner{position:absolute;left:0;right:0;top:0;padding-top:28px}
.th{height:var(--row);display:grid;grid-template-columns:6px 1fr;border-bottom:1px solid var(--line);cursor:pointer}
.th.sel{background:var(--surface2)}
.th .col{border-radius:0}
.th .body{padding:6px 8px 4px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.th .tname{font-weight:600;background:transparent;border:none;padding:2px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tbtn{width:28px;height:24px;padding:0;font-size:12px;font-weight:700;border-radius:6px}
.tbtn.m.on{background:#FFC83D;border-color:#FFC83D;color:#111}
.tbtn.s.on{background:var(--accent2);border-color:var(--accent2);color:#111}
.tbtn.r .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec)}
.tbtn.r.on{background:var(--rec);border-color:var(--rec)}
.tbtn.r.on .dot{background:#fff}
.th input[type=range]{width:100%;margin:0;height:16px}
.hmeter{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.hmeter>div{height:100%;width:0;background:var(--accent2)}
#addTrack{margin:10px;width:calc(100% - 20px)}
#tlview{position:relative;min-width:0;min-height:0}
#tlcanvas{position:absolute;inset:0;width:100%;height:100%}
#tlscroll{position:absolute;inset:0;overflow:auto}
#tlscroll:focus-visible{outline-offset:-3px}
#tlspacer{pointer-events:none}
#panel{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;height:280px}
#panel.collapsed{height:40px}
#ptabs{display:flex;align-items:center;gap:4px;padding:4px 10px;border-bottom:1px solid var(--line);flex:none}
#ptabs button.tab{background:transparent;border:none;color:var(--dim);padding:6px 14px}
#ptabs button.tab.active{color:var(--text);background:var(--surface2)}
#pbody{flex:1;overflow:auto;padding:12px 14px;min-height:0}
.strips{display:flex;gap:8px;height:100%;min-height:200px}
.strip{width:112px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.strip.sel{border-color:var(--accent)}
.strip .cbar{height:4px;width:100%;border-radius:2px}
.strip .sname{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.strip .fader{display:flex;gap:8px;flex:1;min-height:60px;align-items:stretch}
.strip input.v{writing-mode:vertical-lr;direction:rtl;width:22px;height:100%;margin:0}
.vmeter{width:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.vmeter>div{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--accent2) 70%,#FFC83D 90%,var(--rec))}
.strip input.p{width:100%;margin:0}
.fxcards{display:flex;gap:10px;align-items:flex-start;min-height:100%}
.fx{width:230px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.fx.off{opacity:.55}
.fx .fxhead{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.fx .fxhead .n{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .fxhead button{padding:2px 7px;font-size:12px}
.prm{display:grid;grid-template-columns:1fr auto;font-size:12px;margin-top:4px}
.prm input{grid-column:1/3;width:100%;margin:2px 0 0}
.snd{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:6px 10px;border-radius:8px}
.snd:hover{background:var(--surface2)}
.snd .sw{width:10px;height:28px;border-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 12px;border-radius:999px;font-size:12px}

/* overlays */
#menu{position:fixed;z-index:50;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 10px 40px #0008;display:flex;flex-direction:column}
#menu button{background:transparent;border:none;text-align:left;padding:8px 12px}
#menu button:hover,#menu button:focus{background:#3a3a48}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#modalBack{position:fixed;inset:0;background:#0009;z-index:60;display:grid;place-items:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,92vw);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:10px;padding:0}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#2e2e3a;border:1px solid var(--line);border-radius:10px;padding:10px 16px;box-shadow:0 6px 24px #0007;max-width:80vw}
.toast.err{border-color:var(--rec)}
#help{font-size:12px;line-height:1.7}
kbd{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:inherit;font-size:11px}
@media (max-width:760px){
  .page{padding:18px}
  #tl{grid-template-columns:150px 1fr}
  #panel{height:250px}
  .strips{min-height:226px}
  #ptabs .hint{display:none}
  #nav .logo span{display:none}
}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="logo"><i>Y</i><span>Yursic Studio</span></div>
    <button class="tab" data-page="home" data-k="nav-home">Projects</button>
    <button class="tab" data-page="plugins" data-k="nav-plugins">Plugins</button>
    <button class="tab" data-page="files" data-k="nav-files">Files</button>
    <div class="grow"></div>
    <span class="dim small" id="navinfo"></span>
  </nav>
  <div id="main"></div>
</div>
<div id="toasts"></div>
<input type="file" id="filePick" class="hidden">

<script>

const Plugins = {
  installed: new Map(), // id -> { def, files: {path: ArrayBuffer} }
  async load() {
    for (const [id, rec] of await DB.all('plugins')) {
      const r = parsePlugin(rec.json);
      if (r.def) this.installed.set(id, { def: r.def, files: rec.files || {}, installed: rec.installed });
    }
  },
  get(id) { return BUILTIN_FX.find(d => d.id === id) || this.installed.get(id)?.def || null; },
  effects() { return [...BUILTIN_FX, ...[...this.installed.values()].map(p => p.def).filter(d => d.chain.length)]; },
  /** files: Map(path -> ArrayBuffer). Finds plugin.json (root or one folder down). */
  async install(files, sourceName) {
    let root = null;
    for (const path of files.keys()) {
      const parts = path.split('/');
      if (parts[parts.length - 1].toLowerCase() === 'plugin.json' && (root == null || parts.length - 1 < root.split('/').length - 1))
        root = parts.slice(0, -1).join('/');
    }
    if (root == null) throw new Error(`${sourceName}: no plugin.json found.`);
    const pre = root ? root + '/' : '';

    const r = parsePlugin(json);
    if (r.def) for (const s of r.def.sounds) if (!files.has(pre + s.file)) r.errors.push(`sound "${s.file}": file not found`);
    if (r.errors.length) throw new Error(`${sourceName}: ` + r.errors.join('; '));
    if (BUILTIN_FX.some(d => d.id === r.def.id)) throw new Error(`"${r.def.id}" is a built-in effect id.`);
    const keep = {};
    for (const s of r.def.sounds) keep[s.file] = files.get(pre + s.file);
    const replaced = this.installed.has(r.def.id);
    const rec = { json, files: keep, installed: new Date().toISOString() };
    await DB.put('plugins', r.def.id, rec);
    this.installed.set(r.def.id, { def: r.def, files: keep, installed: rec.installed });
    return { def: r.def, replaced };
  },
  async installFile(file) {
    const buf = await file.arrayBuffer();
    if (ext(file.name) === 'json') return this.install(new Map([['plugin.json', buf]]), file.name);
    return this.install(await unzip(buf), file.name);
  },
  async remove(id) { await DB.del('plugins', id); this.installed.delete(id); },
};

      const vm = document.querySelector(`[data-vmeter="${t.id}"]`); if (vm) vm.style.height = pct;
    }
    const mv = Engine.level(Engine.masterAn); Engine._mm = mv > (Engine._mm || 0) ? mv : (Engine._mm || 0) * 0.88;
    const mm = $('#masterMeter'); if (mm) mm.style.width = Math.min(100, Engine._mm * 100) + '%';
    const vmm = document.querySelector('[data-vmeter="master"]'); if (vmm) vmm.style.height = Math.min(100, Engine._mm * 100) + '%';
  }
  requestAnimationFrame(frame);
}

// ---------- start ----------
(async function start() {
  await DB.open();
  await Engine.init();
  await Plugins.load();
  await refreshLibrary();
  const unlock = () => Engine.resume();
  document.addEventListener('pointerdown', unlock); document.addEventListener('keydown', unlock);
  window.addEventListener('gamepadconnected', e => { toast('Controller connected: ' + (e.gamepad.id.split('(')[0].trim() || 'gamepad')); Engine.resume(); });
  $('#navinfo').textContent = DB.db ? '' : 'Storage blocked: export your work';
  go('home');
  requestAnimationFrame(frame); requestAnimationFrame(padLoop);
  window.Yursic = { state, Engine, Plugins, DB, openProject, addSound, BUILTIN_SOUNDS, clipOp, exportMix, undo, redo, newProject, toFile }; // for testing / console
})();
</script>
