# Publishes the web version (web/) to the gh-pages branch, which GitHub Pages serves.
# The example plugins from samples/plugins are copied to /examples so "Install examples" works.
name: Publish web version

on:
  push:
    branches: [main]
    paths: ["web/**", "samples/plugins/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/examples
          cp -r web/. _site/
          cp -r samples/plugins/. _site/examples/
          touch _site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web version from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
